# Builds the StyleSnap release APK and publishes it to GitHub Releases.
#
# Triggers:
#   - push to main/master  -> rolling "development build" prerelease (StyleSnap-dev.apk)
#   - push of a v* tag     -> stable release (StyleSnap-vX.Y.Z.apk)
#   - workflow_dispatch    -> manual run (updates the rolling release)
#
# The Android platform folders are not committed; this workflow generates them
# with `flutter create .` and injects the runtime permissions the app needs
# (see .github/scripts/prepare_android.sh).

name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create/attach GitHub Releases

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build & release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pin a known-good Flutter; bump the version as you upgrade the project.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.0"
          cache: true

      - name: Generate Android scaffolding
        run: |
          flutter config --no-analytics
          flutter --version
          # Keeps every existing file (lib/, assets/, pubspec.yaml) and only
          # adds the missing android/ platform folder (+ minimal template files).
          flutter create . --platforms=android --org com.stylesnap --project-name stylesnap
          # The template test references MyApp and is not part of this project.
          rm -f test/widget_test.dart

      - name: Configure Android app (permissions, label, cleartext)
        run: bash .github/scripts/prepare_android.sh

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis (informational, does not block the build)
        run: flutter analyze
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release
        # Prefer smaller per-device downloads instead of one universal APK?
        # Use: flutter build apk --release --split-per-abi

      - name: Stage APK for publishing
        id: stage
        shell: bash
        run: |
          mkdir -p dist
          VERSION=$(awk '/^version:/{print $2; exit}' pubspec.yaml)   # e.g. 1.0.0+1
          BASE=${VERSION%%+*}                                         # 1.0.0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            APK_NAME="StyleSnap-${GITHUB_REF_NAME}.apk"
            MODE=tag
          else
            APK_NAME="StyleSnap-dev.apk"
            MODE=dev
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$APK_NAME"
          {
            echo "apk_name=$APK_NAME"
            echo "mode=$MODE"
            echo "version=$BASE"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Build result"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| APK | \`$APK_NAME\` ($(du -h "dist/$APK_NAME" | cut -f1)) |"
            echo "| App version | \`$VERSION\` |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.apk_name }}
          path: dist/${{ steps.stage.outputs.apk_name }}
          if-no-files-found: error

      # Stable release: every v* tag gets a GitHub Release with the APK.
      - name: Attach APK to release (tag build)
        if: steps.stage.outputs.mode == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK="dist/${{ steps.stage.outputs.apk_name }}"
          # GitHub's API occasionally answers 500 right after repo creation — retry.
          for i in 1 2 3 4; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "$APK" --clobber && break
            else
              gh release create "$TAG" "$APK" --title "StyleSnap $TAG" --generate-notes && break
            fi
            echo "attempt $i failed; retrying in 15 s ..."
            sleep 15
          done

      # Rolling development release: main-branch builds replace StyleSnap-dev.apk.
      - name: Update rolling development release (branch build)
        if: steps.stage.outputs.mode == 'dev'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          APK="dist/${{ steps.stage.outputs.apk_name }}"
          NOTES=$(cat <<'EOF'
          Automated development build (main branch).

          - **Demo mode works out of the box** — no server needed.
          - For real AI try-on, deploy the StyleSnap bridge (see `backend/README.md`)
            and set it in *Profile → Bridge server URL*.
          - The APK is signed with the debug key: installable, not for store distribution.
          EOF
          )
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$APK" --clobber
            gh release edit latest --notes "$NOTES (commit ${GITHUB_SHA::7}, app v${{ steps.stage.outputs.version }})"
          else
            gh release create latest "$APK" \
              --title "StyleSnap — development build" \
              --notes "$NOTES (commit ${GITHUB_SHA::7}, app v${{ steps.stage.outputs.version }})" \
              --prerelease
          fi
          # GitHub's API occasionally answers 500 on fresh repos — retry the
          # whole publish flow if nothing above succeeded yet.
          if ! gh release view latest >/dev/null 2>&1; then
            for i in 2 3 4; do
              echo "attempt $i: retrying release publish in 15 s ..."
              sleep 15
              if gh release create latest "$APK" \
                   --title "StyleSnap — development build" \
                   --notes "$NOTES (commit ${GITHUB_SHA::7}, app v${{ steps.stage.outputs.version }})" \
                   --prerelease; then
                break
              fi
            done
          fi
